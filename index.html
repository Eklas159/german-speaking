/* ---------- global search ---------- */
let searchTimer;
document.getElementById("q").addEventListener("input", e=>{
 clearTimeout(searchTimer);
 const term = e.target.value.trim();
 searchTimer = setTimeout(()=>runSearch(term), 150);
});
function runSearch(term){
 if(!term){ if(location.hash.slice(1)!=="") render(location.hash.slice(1)); return; }
 const t = term.toLowerCase();
 const hits = [];
 const scan = (arr, type, render) => {
   arr.forEach((item, i) => {
     const text = JSON.stringify(item).toLowerCase();
     if(text.includes(t)) hits.push(render(item, i));
   });
 };
 scan(FORMULAS, "formula", (f)=>`<div class="card"><span class="tag">Formula</span> ${sb(f[0])}<span class="de">${hl(f[0],term)}</span><div class="en">${hl(f[1],term)}</div></div>`);
 VOCAB.forEach(c=>c.items.forEach(it=>{
   if(JSON.stringify(it).toLowerCase().includes(t)) hits.push(`<div class="card"><span class="tag">Vocab</span> ${sb(it[0])}<span class="de">${hl(it[0],term)}</span> — <span class="en">${hl(it[1],term)}</span></div>`);
 }));
 scan(VERBS, "verb", (v)=>`<div class="card"><span class="tag">Verb</span> ${sb(v[0])}<span class="de">${hl(v[0],term)}</span> — <span class="en">${hl(v[1],term)}</span></div>`);
 scan(GRAMMAR, "grammar", (g)=>`<div class="card"><span class="tag">Grammar</span> <b>${hl(g[0],term)}</b><p class="en">${hl(g[2],term)}</p></div>`);
 scan(CONNECTORS, "connector", (c)=>`<div class="card"><span class="tag">Connector</span> ${sb(c[0])}<span class="de">${hl(c[0],term)}</span> — <span class="en">${hl(c[1],term)}</span></div>`);
 scan(MISTAKES, "mistake", (m)=>`<div class="card"><span class="tag">Mistake</span> ${sb(m[1])}<span class="de">${hl(m[1],term)}</span></div>`);
 scan(FALSE, "false friend", (f)=>`<div class="card"><span class="tag">False friend</span> ${sb(f[0])}<span class="de">${hl(f[0],term)}</span> — <span class="en">${hl(f[2],term)}</span></div>`);
 CONVOS.forEach(c=>{ if(JSON.stringify(c).toLowerCase().includes(t)) hits.push(`<div class="card"><span class="tag">Scenario</span> ${hl(c.t,term)}</div>`); });
 SURVIVAL.forEach(g=>g.items.forEach(it=>{
   if(JSON.stringify(it).toLowerCase().includes(t)) hits.push(`<div class="card"><span class="tag">Phrase</span> ${sb(it[0])}<span class="de">${hl(it[0],term)}</span> — <span class="en">${hl(it[1],term)}</span></div>`);
 }));
 scan(PRON, "pronunciation", (p)=>`<div class="card"><span class="tag">Pronunciation</span> <b>${hl(p[0],term)}</b><p class="en">${hl(p[1],term)}</p></div>`);
 const wrap = document.getElementById("wrap");
 wrap.innerHTML = `<section class="view on"><h1>Search: "${esc(term)}"</h1><p class="en">${hits.length} matches</p>${hits.slice(0,80).join("")}</section>`;
}
function hl(s, term){
 const re = new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
 return String(s).replace(re, "<mark>$1</mark>");
}

/* ---------- timer ---------- */
function openTimer(mins){
 const dlg = document.getElementById("timerDlg");
 const options = [30,60,120,180,300,600];
 dlg.innerHTML = `<h3>Speaking Timer</h3>
  <div class="chipbar">${options.map(s=>`<button onclick="startTimer(${s})">${s<60?s+"s":(s/60)+" min"}</button>`).join("")}</div>
  <div class="timer" id="timerDisp">00:00</div>
  <div class="card" id="timerTopic"></div>
  <div class="row"><button class="btn ghost" onclick="document.getElementById('timerDlg').close()">Close</button></div>`;
 dlg.showModal();
 if(mins) startTimer(mins*60);
}
let timerInt;
function startTimer(sec){
 clearInterval(timerInt);
 const q = QBANK[Math.floor(Math.random()*QBANK.length)];
 document.getElementById("timerTopic").innerHTML = `<b>Topic:</b> ${sb(q[2])}<span class="de">${q[2]}</span>`;
 let left = sec;
 const disp = document.getElementById("timerDisp");
 const tick = ()=>{
   const m = String(Math.floor(left/60)).padStart(2,"0");
   const s = String(left%60).padStart(2,"0");
   disp.textContent = m+":"+s;
   if(left<=0){ clearInterval(timerInt); disp.textContent = "Time!"; markPracticedToday(Math.round(sec/60)||1); bump("speakMin", Math.round(sec/60)||1); return; }
   left--;
 };
 tick(); timerInt = setInterval(tick, 1000);
}
document.getElementById("fabTimer").addEventListener("click", ()=>openTimer());
