<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Fluency Master — a speaking training system</title>
<style>
:root{
  --ink:#0d1a24; --ink2:#16293a; --paper:#eef1f3; --paper2:#ffffff; --line:#c9d3da;
  --txt:#12202c; --txt-dim:#4e6373; --de:#0b3c5d; --accent:#c26a1e; --accent2:#1f7a70;
  --warn:#9d2f3a; --ok:#2c6e49; --chip:#dde5ea; --shadow:0 1px 0 var(--line);
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --rail:248px; --maxw:74ch;
}
html[data-theme="dark"]{
  --ink:#f2f6f8; --ink2:#dbe6ee; --paper:#0b141c; --paper2:#111e28; --line:#2a3d4c;
  --txt:#e7eef3; --txt-dim:#9fb3c0; --de:#8fd0e8; --accent:#e9a24a; --accent2:#5ec8b8;
  --warn:#f08a92; --ok:#7fd1a0; --chip:#1b2c39;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--txt);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
de,.de{font-family:var(--serif);color:var(--de);font-size:1.03em;line-height:1.45}
.en{color:var(--txt-dim)}
button{font:inherit;color:inherit;cursor:pointer}
mark{background:var(--accent);color:#0b141c;padding:0 .12em;border-radius:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--paper2);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 40px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand svg{flex:0 0 auto}
.brand b{font-size:15px;letter-spacing:.01em;line-height:1.15;display:block}
.brand span{font-size:11.5px;color:var(--txt-dim)}
.navgrp{margin:14px 0 4px;padding:0 10px;font-size:11px;letter-spacing:.09em;color:var(--txt-dim);
  text-transform:lowercase;font-variant:small-caps;font-size:13px}
.navgrpsub{display:block;font-variant:normal;text-transform:none;font-size:10.5px;letter-spacing:0;
  color:var(--txt-dim);opacity:.65;margin-top:1px}
.rail a.nav{display:block;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--txt);
  font-size:14px;border-left:2px solid transparent}
.rail a.nav:hover{background:var(--chip)}
.rail a.nav.on{background:var(--chip);border-left-color:var(--accent);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;
  padding:10px 20px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
#q{flex:1;max-width:520px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper2);color:var(--txt);font-size:14px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:12.5px;white-space:nowrap}
.iconbtn{background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:#0b141c;font-weight:600}
.wrap{padding:26px 26px 90px;width:100%;max-width:980px;margin:0 auto}
section.view{display:none;animation:none}
section.view.on{display:block}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.08;margin:.1em 0 .25em;letter-spacing:-.02em;font-weight:800}
h2{font-size:22px;margin:34px 0 10px;letter-spacing:-.01em;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:17px;margin:22px 0 8px}
p{max-width:var(--maxw)}
ul,ol{max-width:var(--maxw)}
li{margin:.22em 0}
.lede{font-size:18px;color:var(--txt-dim);max-width:62ch}

/* ---------- pieces ---------- */
.card{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h4{margin:0 0 6px;font-size:15.5px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);
  border:1px solid var(--line);color:var(--txt-dim);margin-right:5px;vertical-align:2px}
.tag.a1{color:var(--ok)}.tag.a2{color:var(--accent2)}.tag.b1{color:var(--accent)}.tag.b2{color:var(--warn)}
.tag.col{color:var(--accent);border-color:var(--accent)}
.tag.slang{color:var(--warn);border-color:var(--warn)}
.fav{float:right;background:none;border:0;font-size:16px;line-height:1;opacity:.35;padding:2px 4px}
.fav.on{opacity:1}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0;display:block;overflow-x:auto;
  white-space:nowrap}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--txt-dim);font-weight:600;position:sticky;top:0;background:var(--paper2)}
tr:hover td{background:var(--chip)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--paper2)}
details>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.1em;color:var(--accent);font-weight:800}
details[open]>summary::before{content:"–"}
.btn{background:var(--accent);color:#0b141c;border:0;border-radius:9px;padding:8px 14px;font-weight:650;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent)}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi small{display:block;font-size:12px;font-weight:500;color:var(--txt-dim);letter-spacing:0;margin-top:4px}
.note{border-left:3px solid var(--accent2);padding:8px 0 8px 12px;margin:12px 0;color:var(--txt-dim);
  max-width:var(--maxw);font-size:14.5px}
.warnbox{border-left:3px solid var(--warn)}
.drill{font-size:14px;color:var(--txt-dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.drill b{color:var(--txt)}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--chip);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chipbar button{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.chipbar button.on{background:var(--accent);border-color:var(--accent);color:#0b141c;font-weight:600}
.dlg{margin:10px 0;max-width:var(--maxw)}
.dlg div{margin:3px 0}
.dlg .sp{display:inline-block;min-width:26px;color:var(--accent);font-weight:700;font-size:13px}
.big{font-size:20px;font-family:var(--serif);color:var(--de)}
.ok{color:var(--ok)}.bad{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:2px}
.hero{border:1px solid var(--line);border-radius:16px;padding:22px;background:
  linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--paper2)),var(--paper2))}
.diagram{font-family:var(--serif);font-size:17px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.sl{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--chip)}
.sl.v{background:color-mix(in srgb,var(--accent) 30%,var(--paper2));border-color:var(--accent);font-weight:700}
.sl.s{background:color-mix(in srgb,var(--accent2) 26%,var(--paper2));border-color:var(--accent2)}
.sl.t{background:color-mix(in srgb,var(--de) 18%,var(--paper2))}
.sl.e{border-style:dashed}
.legend{font-size:12.5px;color:var(--txt-dim);margin:6px 0 14px}
.check{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.check input{margin-top:5px;width:17px;height:17px;accent-color:var(--accent)}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:8px;cursor:pointer;user-select:none}
.timer{font-size:54px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.spark{display:flex;gap:3px;align-items:flex-end;height:60px;margin:10px 0}
.spark i{flex:1;background:var(--accent2);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.fabs{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
.fab{border-radius:999px;border:1px solid var(--line);background:var(--paper2);padding:11px 16px;
  font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab.hot{background:var(--warn);color:#fff;border-color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper2);color:var(--txt);
  max-width:620px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(3,10,16,.6)}
.hide{display:none!important}
.spk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;
  border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:13px;vertical-align:-6px;
  margin-right:4px;flex:0 0 auto}
.spk:hover{border-color:var(--accent)}
.spk.playing{background:var(--accent);border-color:var(--accent)}
.spk.slow{width:auto;padding:0 8px;font-size:11px;gap:3px}
.voicewarn{font-size:12.5px;color:var(--warn);border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}
.dewrap{display:inline-flex;align-items:center;gap:2px}
.count{font-size:12.5px;color:var(--txt-dim)}
@media(max-width:860px){
  .rail{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .18s}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menubtn{display:block}
  .wrap{padding:18px 14px 90px}
  table{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="shell">
<nav class="rail" id="rail">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 1 5 5v4a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z" fill="var(--accent)"/><path d="M4 11a8 8 0 0 0 16 0M12 19v3" stroke="var(--de)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span><b>Deutsch Fluency Master</b><span>Speak-first training system</span></span>
  </div>
  <div id="navlinks"></div>
</nav>
<div class="main">
  <header class="topbar">
    <button class="menubtn" id="menubtn" aria-label="Open navigation">☰</button>
    <input id="q" type="search" placeholder="Search words, formulas, grammar, phrases…" autocomplete="off">
    <div class="tb-right">
      <span class="pill" id="streakPill">🔥 0</span>
      <button class="iconbtn" id="slowbtn" title="Toggle slow speech for audio playback">🐢 Slow</button>
      <button class="iconbtn" id="themebtn" title="Toggle light / dark">◐</button>
    </div>
  </header>
  <div class="wrap" id="wrap"></div>
</div>
</div>
<div class="fabs">
  <button class="fab" id="fabTimer">⏱ Drill</button>
  <button class="fab hot" id="fabHelp">🆘 Stuck</button>
</div>
<dialog id="helpDlg"></dialog>
<dialog id="timerDlg"></dialog>
<script>
/* ===== data helpers ===== */
const P = s => s.trim().split("\n").filter(Boolean).map(r => r.split("|").map(c => c.trim()));
const E = s => s.split("~").map(x => x.trim()).filter(Boolean);

/* ===== 1. FORMULA SENTENCES (100) =====
   de | en | examples(~) | what goes in the blank | level | situation | drill  */
const FORMULAS = P(`
Ich möchte ___.|I would like ___. Polite wanting — your single most useful sentence.|Ich möchte einen Kaffee, bitte. — I'd like a coffee, please.~Ich möchte hier bleiben. — I'd like to stay here.~Ich möchte mit dir sprechen. — I'd like to talk to you.|A noun in the accusative (einen/eine/ein …) or an infinitive at the end.|A1|Cafés, shops, offices, anywhere you want something|Say 10 things you want right now: food, drinks, actions.
Ich brauche ___.|I need ___.|Ich brauche Hilfe. — I need help.~Ich brauche mehr Zeit. — I need more time.~Ich brauche keinen Zucker. — I don't need any sugar.|A noun in the accusative. Negate with kein-.|A1|Shopping, work, asking for help|Name 10 things you need today.
Ich habe ___.|I have ___.|Ich habe eine Frage. — I have a question.~Ich habe Hunger. — I'm hungry.~Ich habe morgen frei. — I'm off tomorrow.|A noun (accusative), or a fixed expression: Hunger, Durst, Zeit, Angst, Glück.|A1|Everywhere|List what you have in your bag, in German.
Ich habe kein ___ / keine ___.|I don't have any ___.|Ich habe keine Zeit. — I have no time.~Ich habe kein Geld dabei. — I don't have money on me.~Ich habe keinen Hunger. — I'm not hungry.|A noun. kein + der-word → keinen (acc.), die → keine, das → kein.|A1|Declining, explaining|Negate 10 sentences with haben.
Ich kann ___.|I can ___.|Ich kann schwimmen. — I can swim.~Ich kann dir helfen. — I can help you.~Ich kann das erklären. — I can explain that.|An infinitive at the very end of the sentence.|A1|Offering, describing ability|Say 8 things you can do; put the verb last every time.
Ich kann nicht ___.|I can't ___.|Ich kann heute nicht kommen. — I can't come today.~Ich kann das nicht lesen. — I can't read that.~Ich kann nicht so schnell sprechen. — I can't speak that fast.|Infinitive at the end; nicht goes before it.|A1|Declining, apologising|Turn 8 "Ich kann"-sentences into negatives.
Ich muss ___.|I have to ___.|Ich muss jetzt gehen. — I have to go now.~Ich muss noch arbeiten. — I still have to work.~Ich muss das üben. — I have to practise that.|Infinitive at the end.|A1|Leaving, explaining obligations|Say 6 things you must do today and 2 you must not forget.
Ich will ___.|I want ___. Direct, sometimes blunt — softer is möchte.|Ich will das nicht. — I don't want that.~Ich will Deutsch lernen. — I want to learn German.~Ich will nach Hause. — I want to go home.|Noun (accusative) or infinitive. With friends it is normal; in shops use möchte.|A1|Friends, family, strong statements|Say the same wish twice: once with will, once with möchte.
Ich würde gern ___.|I'd like to ___ (friendly, polite).|Ich würde gern mehr reisen. — I'd like to travel more.~Ich würde gern Deutsch üben. — I'd like to practise German.~Ich würde gern etwas fragen. — I'd like to ask something.|Infinitive at the end.|A2|Polite wishes, small talk|Describe 5 things you'd like to do this year.
Ich darf ___.|I'm allowed to ___.|Darf ich hier parken? — May I park here?~Ich darf nicht zu spät kommen. — I mustn't be late.~Darf ich kurz stören? — May I interrupt briefly?|Infinitive at the end. Question form = Darf ich …?|A2|Permission, politeness at work|Ask 5 permission questions for your day.
Kannst du ___?|Can you ___? (informal)|Kannst du mir helfen? — Can you help me?~Kannst du das wiederholen? — Can you repeat that?~Kannst du kurz warten? — Can you wait a moment?|Infinitive at the end.|A1|Friends, colleagues you say du to|Ask 6 favours of a friend.
Können Sie ___?|Could you ___? (formal)|Können Sie mir bitte helfen? — Could you help me, please?~Können Sie das aufschreiben? — Could you write that down?~Können Sie langsamer sprechen? — Could you speak more slowly?|Infinitive at the end. Add bitte to soften.|A1|Strangers, officials, shops|Repeat the du-version above in Sie-form.
Könntest du mir helfen?|Could you help me? — softer than kannst du.|Könntest du mir kurz helfen? — Could you help me for a second?~Könnten Sie mir bitte helfen? — Could you help me, please?~Könntest du mir das erklären? — Could you explain that to me?|Add an infinitive phrase after mir: … mir mit dem Formular helfen.|A2|Asking favours politely|Ask for help in three levels: kannst du / könntest du / könnten Sie.
Wie kann ich ___?|How can I ___?|Wie kann ich das bezahlen? — How can I pay for that?~Wie kann ich dorthin kommen? — How can I get there?~Wie kann ich mich anmelden? — How can I register?|Infinitive at the end.|A2|Offices, tickets, apps|Ask 6 how-questions about everyday tasks.
Wo kann ich ___?|Where can I ___?|Wo kann ich Wasser kaufen? — Where can I buy water?~Wo kann ich hier parken? — Where can I park here?~Wo kann ich das Ticket kaufen? — Where can I buy the ticket?|Infinitive at the end.|A1|Travel, shopping, new city|Ask where you can do 8 daily things.
Wann ___?|When ___?|Wann fängt der Kurs an? — When does the course start?~Wann kommst du? — When are you coming?~Wann hast du Zeit? — When do you have time?|Verb comes directly after wann.|A1|Appointments, plans|Ask 6 when-questions about someone's week.
Was bedeutet ___?|What does ___ mean?|Was bedeutet "Feierabend"? — What does "Feierabend" mean?~Was bedeutet das genau? — What exactly does that mean?~Was bedeutet dieses Wort? — What does this word mean?|A word, in quotation marks or with das.|A1|Every conversation while learning|Pick 5 new words and ask about them out loud.
Was meinst du mit ___?|What do you mean by ___?|Was meinst du mit "später"? — What do you mean by "later"?~Was meinen Sie mit diesem Satz? — What do you mean by this sentence?~Was meinst du damit? — What do you mean by that?|A quoted word or damit.|A2|Clarifying, meetings|Ask for clarification 5 times about vague words.
Ich glaube, dass ___.|I believe that ___.|Ich glaube, dass er recht hat. — I think he's right.~Ich glaube, dass das zu teuer ist. — I think that's too expensive.~Ich glaube, dass wir Zeit haben. — I think we have time.|A whole clause — and the verb moves to the end.|A2|Opinions|Give 5 opinions; check the verb is last each time.
Ich denke, dass ___.|I think that ___.|Ich denke, dass du recht hast. — I think you're right.~Ich denke, dass es funktioniert. — I think it works.~Ich denke, dass wir früher anfangen sollten. — I think we should start earlier.|A clause with the verb at the end. You may also drop dass: Ich denke, du hast recht.|A2|Discussions, work|Say each opinion twice: with dass and without.
Ich finde, dass ___.|I find / I feel that ___ — the most natural German for personal opinions.|Ich finde, dass der Film langweilig war. — I think the film was boring.~Ich finde das gut. — I think that's good.~Ich finde, wir sollten gehen. — I think we should go.|A clause, or simply a noun + adjective: Ich finde das interessant.|A2|Everyday opinions|Judge 8 things around you with Ich finde …
Meiner Meinung nach ___.|In my opinion ___.|Meiner Meinung nach ist das falsch. — In my opinion that's wrong.~Meiner Meinung nach sollten wir warten. — In my opinion we should wait.~Meiner Meinung nach lohnt sich das nicht. — In my view it isn't worth it.|A main clause — but the verb comes second, right after the phrase.|B1|Debates, formal opinions|State 5 opinions; keep the verb in position 2.
Ich bin mir nicht sicher, ob ___.|I'm not sure whether ___.|Ich bin mir nicht sicher, ob das stimmt. — I'm not sure if that's right.~Ich bin mir nicht sicher, ob ich kann. — I'm not sure if I can.~Ich bin mir nicht sicher, ob er kommt. — I'm not sure whether he's coming.|A clause with the verb at the end.|B1|Hedging, honest uncertainty|Hedge 5 statements you'd normally say confidently.
Es kommt darauf an, ob ___.|It depends on whether ___.|Es kommt darauf an, ob es regnet. — It depends on whether it rains.~Es kommt darauf an, ob ich Zeit habe. — Depends if I have time.~Es kommt darauf an, wie viel es kostet. — It depends how much it costs.|ob / wie / wann + clause, verb last.|B1|Making plans|Answer 5 yes/no questions with "it depends" + a condition.
Das hängt davon ab, ob ___.|That depends on whether ___.|Das hängt davon ab, ob du mitkommst. — That depends on whether you come along.~Das hängt vom Wetter ab. — That depends on the weather.~Das hängt davon ab, wann wir anfangen. — It depends when we start.|ob-clause, or von + dative noun.|B1|Negotiating, planning|Say the same idea with both patterns (davon ab / kommt darauf an).
Ich habe keine Ahnung, aber ___.|I have no idea, but ___.|Ich habe keine Ahnung, aber ich frage mal. — No idea, but I'll ask.~Ich habe keine Ahnung, aber vielleicht morgen. — No clue, but maybe tomorrow.~Keine Ahnung, ehrlich gesagt. — Honestly, no idea.|Any main clause after aber. Casual register.|A2|Casual conversation|Answer 5 hard questions honestly instead of freezing.
Ich weiß nicht genau, aber ___.|I don't know exactly, but ___.|Ich weiß nicht genau, aber ich schätze zwanzig Euro. — Not sure, but I'd guess twenty euros.~Ich weiß nicht genau, aber ich kann nachsehen. — I'm not sure, but I can check.~Ich weiß nicht genau, wann er kommt. — I don't know exactly when he's coming.|A guess, an offer, or a wann/wo/wie-clause.|A2|Work, service situations|Give 5 approximate answers instead of silence.
Wenn ich ___, dann ___.|If / when I ___, then ___.|Wenn ich Zeit habe, dann rufe ich dich an. — If I have time, I'll call you.~Wenn ich müde bin, trinke ich Kaffee. — When I'm tired I drink coffee.~Wenn es regnet, bleiben wir zu Hause. — If it rains we stay home.|Condition (verb at the end), then main clause with the verb first.|A2|Plans, conditions|Build 6 wenn-sentences about your week.
Weil ich ___.|Because I ___.|Ich bleibe zu Hause, weil ich krank bin. — I'm staying home because I'm ill.~Weil ich keine Zeit habe, komme ich später. — Because I have no time I'll come later.~Ich lerne Deutsch, weil ich hier arbeite. — I'm learning German because I work here.|A clause — the verb jumps to the end after weil.|A2|Explaining yourself|Give reasons for 8 things you did today.
Obwohl ___, ___.|Although ___, ___.|Obwohl es regnet, gehe ich laufen. — Although it's raining, I'm going running.~Ich mag ihn, obwohl er oft zu spät kommt. — I like him although he's often late.~Obwohl ich müde bin, arbeite ich weiter. — Even though I'm tired, I keep working.|A clause with the verb at the end.|B1|Nuanced opinions|Concede a point 5 times, then state yours.
Nachdem ich ___, ___.|After I ___, ___.|Nachdem ich gegessen habe, gehe ich spazieren. — After I've eaten I go for a walk.~Nachdem ich aufgestanden bin, dusche ich. — After getting up I shower.~Nachdem wir fertig waren, sind wir gegangen. — After we finished, we left.|Perfect tense clause, verb at the end.|B1|Telling your routine or a story|Describe your morning in 5 nachdem-steps.
Bevor ich ___, ___.|Before I ___, ___.|Bevor ich schlafe, lese ich kurz. — Before I sleep I read a bit.~Bevor ich gehe, muss ich das fertig machen. — Before I leave I have to finish this.~Bevor wir bestellen, schauen wir die Karte an. — Before we order, we look at the menu.|Present tense clause, verb at the end.|A2|Sequencing, routines|Say 5 things you do before other things.
Ich habe vor, ___ zu ___.|I plan to ___.|Ich habe vor, nächstes Jahr umzuziehen. — I plan to move next year.~Ich habe vor, mehr zu sprechen. — I plan to speak more.~Was hast du am Wochenende vor? — What are your plans for the weekend?|An infinitive with zu at the end; separable verbs take -zu- inside: umzuziehen.|B1|Plans, small talk|State 5 plans for the next month.
Ich habe Lust auf ___.|I feel like ___ (having something).|Ich habe Lust auf Pizza. — I feel like pizza.~Hast du Lust auf einen Kaffee? — Fancy a coffee?~Ich habe Lust auf einen Spaziergang. — I feel like a walk.|auf + accusative noun. For an activity: Ich habe Lust, ins Kino zu gehen.|A2|Friends, making plans|Suggest 5 activities with Hast du Lust auf …?
Ich habe keine Lust auf ___.|I don't feel like ___.|Ich habe keine Lust auf Streit. — I don't feel like arguing.~Ich habe heute keine Lust zu kochen. — I don't feel like cooking today.~Ehrlich gesagt habe ich keine Lust. — Honestly, I don't feel like it.|auf + accusative, or zu + infinitive. Direct but normal among friends.|A2|Friends — too blunt for a boss|Decline 5 invitations politely and 2 bluntly.
Ich freue mich auf ___.|I'm looking forward to ___.|Ich freue mich auf das Wochenende. — I'm looking forward to the weekend.~Ich freue mich auf deinen Besuch. — I look forward to your visit.~Ich freue mich, dich zu sehen. — I'm happy to see you.|auf + accusative (future things). Use über + accusative for something that already happened.|A2|Emails, friends, work|Name 5 things you're looking forward to.
Ich interessiere mich für ___.|I'm interested in ___.|Ich interessiere mich für Technik. — I'm interested in technology.~Interessierst du dich für Fußball? — Are you into football?~Ich interessiere mich sehr für Geschichte. — I'm very interested in history.|für + accusative noun.|A2|Introductions, interviews|State 5 interests, then ask a partner about theirs.
Ich bin gerade dabei, ___ zu ___.|I'm in the middle of ___-ing.|Ich bin gerade dabei, das Essen zu kochen. — I'm just cooking the food.~Ich bin gerade dabei, Deutsch zu lernen. — I'm in the middle of studying German.~Er ist gerade dabei, umzuziehen. — He's in the middle of moving.|zu + infinitive at the end.|B1|Phone calls, work updates|Narrate 5 things you are doing right now.
Ich versuche, ___ zu ___.|I'm trying to ___.|Ich versuche, jeden Tag zu sprechen. — I try to speak every day.~Ich versuche, weniger zu übersetzen. — I try to translate less.~Ich habe versucht, ihn anzurufen. — I tried to call him.|zu + infinitive at the end.|A2|Explaining effort|Say 5 things you're trying to improve.
Ich habe angefangen, ___ zu ___.|I've started ___-ing.|Ich habe angefangen, Deutsch zu lernen. — I've started learning German.~Ich habe angefangen, mehr zu lesen. — I've started reading more.~Wir haben gerade erst angefangen. — We've only just started.|zu + infinitive at the end.|B1|Talking about habits|Describe 4 new habits.
Ich habe aufgehört, ___ zu ___.|I've stopped ___-ing.|Ich habe aufgehört, alles zu übersetzen. — I've stopped translating everything.~Er hat aufgehört zu rauchen. — He quit smoking.~Ich habe aufgehört, mich zu ärgern. — I stopped getting annoyed.|zu + infinitive at the end.|B1|Habits, health, change|Say 4 things you stopped doing and why.
Ich würde sagen, dass ___.|I'd say that ___.|Ich würde sagen, dass es funktioniert. — I'd say it works.~Ich würde sagen, ungefähr eine Stunde. — I'd say about an hour.~Ich würde sagen, das ist normal. — I'd say that's normal.|A clause with the verb at the end, or just a short estimate.|B1|Careful opinions, estimates|Soften 5 blunt statements.
Ehrlich gesagt, ___.|Honestly, ___.|Ehrlich gesagt finde ich das nicht gut. — Honestly, I don't think that's good.~Ehrlich gesagt bin ich müde. — To be honest, I'm tired.~Ehrlich gesagt weiß ich es nicht. — Honestly, I don't know.|A main clause — the verb comes right after the phrase.|B1|Honest conversation|Give 5 honest opinions.
Im Grunde genommen ___.|Basically ___.|Im Grunde genommen ist es einfach. — Basically it's simple.~Im Grunde genommen haben wir das gleiche Problem. — Basically we have the same problem.~Im Grunde genommen stimmt das. — Basically that's true.|A main clause; the verb stays in second position.|B2|Summarising in discussions|Summarise 4 complicated things in one sentence each.
Zum Beispiel ___.|For example ___.|Zum Beispiel esse ich morgens nur Obst. — For example, I only eat fruit in the morning.~Man kann zum Beispiel den Bus nehmen. — You could, for example, take the bus.~Zum Beispiel diese hier. — This one here, for instance.|A clause or just a noun. Often abbreviated z. B. in writing.|A2|Every explanation|Back up 5 claims with an example.
Einerseits ___, andererseits ___.|On the one hand ___, on the other ___.|Einerseits ist es teuer, andererseits spart man Zeit. — On one hand it's expensive, on the other you save time.~Einerseits mag ich die Stadt, andererseits ist sie laut. — I like the city, but it's loud.~Einerseits stimmt das, andererseits nicht ganz. — Partly true, partly not.|Two main clauses; verb second in both halves.|B2|Balanced opinions, interviews|Argue both sides of 4 topics.
Das Problem ist, dass ___.|The problem is that ___.|Das Problem ist, dass ich keine Zeit habe. — The problem is I have no time.~Das Problem ist, dass es zu teuer ist. — The problem is it's too expensive.~Das Problem war, dass niemand Bescheid wusste. — The problem was nobody knew.|A clause with the verb at the end.|A2|Work, complaints, support calls|Describe 5 real problems from your week.
Der Grund dafür ist, dass ___.|The reason for that is that ___.|Der Grund dafür ist, dass die Bahn gestreikt hat. — The reason is that the railway was on strike.~Der Grund dafür ist ganz einfach. — The reason is quite simple.~Der Hauptgrund ist, dass es billiger ist. — The main reason is that it's cheaper.|A clause with the verb at the end.|B1|Explaining, presentations|Explain the reason behind 4 decisions.
Was ich meine, ist ___.|What I mean is ___.|Was ich meine, ist, dass wir mehr üben müssen. — What I mean is we need to practise more.~Was ich meine, ist ganz einfach. — What I mean is quite simple.~Was ich meine, ist das Gegenteil. — I mean the opposite.|dass-clause or a noun phrase.|B1|Repairing a misunderstanding|Rephrase 5 of your own sentences.
Was ich damit sagen will, ist ___.|What I'm trying to say is ___.|Was ich damit sagen will, ist, dass es sich lohnt. — What I'm getting at is that it's worth it.~Was ich damit sagen will: wir brauchen mehr Zeit. — My point is: we need more time.~Was ich damit sagen wollte, war etwas anderes. — What I meant was something else.|dass-clause, or a colon plus a plain sentence.|B1|Discussions, meetings|Restate your last opinion twice, differently.
Lass mich kurz überlegen.|Let me think for a second. Buys you time in German instead of silence.|Lass mich kurz überlegen … ja, Dienstag passt. — Let me think … yes, Tuesday works.~Lassen Sie mich kurz überlegen. — Let me think for a moment. (formal)~Moment, ich überlege. — One moment, I'm thinking.|Fixed phrase. Follow it with your answer.|A2|Any question you can't answer instantly|Use it before answering 5 hard questions.
Einen Moment, bitte.|One moment, please.|Einen Moment, bitte, ich suche das. — One moment please, I'm looking for it.~Einen Augenblick bitte. — Just a second, please.~Moment mal! — Hang on a second! (casual)|Fixed phrase.|A1|Phone, service, shops|Answer 5 requests with a pause phrase first.
Kannst du das wiederholen?|Can you repeat that?|Kannst du das bitte wiederholen? — Can you repeat that, please?~Können Sie das bitte noch einmal sagen? — Could you say that again, please?~Wie bitte? — Sorry, what? (short and normal)|Fixed phrase. Wie bitte? is the everyday short version.|A1|Every real conversation|Practise until it comes out without thinking.
Kannst du bitte langsamer sprechen?|Can you speak more slowly, please?|Können Sie bitte etwas langsamer sprechen? — Could you speak a bit more slowly?~Etwas langsamer, bitte. — A bit slower, please.~Ich lerne noch Deutsch — bitte langsam. — I'm still learning German — slowly, please.|Fixed phrase; add etwas to soften.|A1|Every conversation with natives|Say it three ways: du, Sie, short.
Wie sagt man ___ auf Deutsch?|How do you say ___ in German?|Wie sagt man "deadline" auf Deutsch? — How do you say "deadline" in German?~Wie sagt man das höflicher? — How do you say that more politely?~Wie sagt man das noch mal? — How do you say that again?|An English word in quotes, or das.|A1|Learning in real time|Ask about 5 words you're missing.
Wie nennt man ___ auf Deutsch?|What do you call ___ in German?|Wie nennt man dieses Gerät auf Deutsch? — What do you call this device in German?~Wie nennt man das hier? — What's this called here?~Wie nennt man so etwas? — What do you call something like that?|A noun or a pointing word (das, so etwas).|A2|Pointing at objects|Point at 8 objects and ask.
Was heißt ___?|What does ___ mean? (very common, short)|Was heißt "Termin"? — What does "Termin" mean?~Was heißt das auf Englisch? — What's that in English?~Wie heißt das noch mal? — What's it called again?|A quoted word or das.|A1|Everywhere|Alternate between Was heißt …? and Was bedeutet …?
Ich habe das nicht verstanden.|I didn't understand that.|Entschuldigung, ich habe das nicht verstanden. — Sorry, I didn't get that.~Ich habe nur die Hälfte verstanden. — I only understood half.~Ich habe das Wort nicht verstanden. — I didn't catch the word.|Fixed; specify what you missed for a faster repair.|A1|Constantly, and that's fine|Say it without apologising twice in a row.
Jetzt verstehe ich.|Now I understand.|Ach so, jetzt verstehe ich. — Ah, now I get it.~Jetzt verstehe ich, was du meinst. — Now I see what you mean.~Alles klar, jetzt ist es klar. — Got it, it's clear now.|Fixed, optionally + was du meinst.|A1|Closing a repair|End 5 clarification loops with it.
Ach so!|Oh, I see! The sound of the penny dropping.|Ach so, das wusste ich nicht. — Oh, I didn't know that.~Ach so, deshalb! — Ah, that's why!~Ach so, alles klar. — I see, all good.|Fixed exclamation. Very natural, casual and neutral.|A1|Daily conversation|Use it three times in your next conversation.
Genau.|Exactly. / Right. The German conversational heartbeat.|Genau, das meine ich. — Exactly, that's what I mean.~Ja, genau so. — Yes, just like that.~Genau das war das Problem. — That's exactly what the problem was.|Fixed, or genau + the thing you're confirming.|A1|Agreeing, back-channelling|Agree 5 times without saying ja alone.
Stimmt.|True. / That's right.|Stimmt, das habe ich vergessen. — True, I forgot that.~Stimmt genau. — Exactly right.~Das stimmt nicht. — That's not true.|Fixed; negate with Das stimmt nicht.|A1|Agreeing and disagreeing|Confirm and deny 5 statements.
Nicht unbedingt.|Not necessarily.|Nicht unbedingt, es kommt darauf an. — Not necessarily, it depends.~Das ist nicht unbedingt ein Problem. — That's not necessarily a problem.~Nicht unbedingt teurer. — Not necessarily more expensive.|Fixed, or before an adjective/noun.|B1|Polite pushback|Soften 5 disagreements.
Das sehe ich anders.|I see it differently — polite disagreement.|Das sehe ich ein bisschen anders. — I see it a bit differently.~Ehrlich gesagt sehe ich das anders. — Honestly, I see it differently.~Das sehe ich genauso. — I see it exactly the same way.|Fixed; add ein bisschen / etwas to soften.|B1|Meetings, debates|Disagree with 5 statements without saying nein.
Da stimme ich dir zu.|I agree with you.|Da stimme ich dir völlig zu. — I completely agree with you.~Da stimme ich Ihnen zu. — I agree with you. (formal)~Da muss ich dir zustimmen. — I have to agree with you there.|zustimmen + dative person (dir / Ihnen / ihm).|B1|Discussions|Agree strongly, then partly, then not at all.
Da bin ich mir nicht sicher.|I'm not sure about that.|Da bin ich mir nicht so sicher. — I'm not so sure about that.~Da bin ich mir ziemlich sicher. — I'm fairly sure about that.~Sicher bin ich mir nicht. — I'm not certain.|Fixed; add nicht so / ziemlich to grade it.|A2|Honest hedging|Rate your certainty about 5 facts.
Das kommt darauf an.|That depends. The perfect stalling answer.|Das kommt drauf an. — Depends. (spoken form)~Kommt darauf an, wie viel Zeit ich habe. — Depends how much time I have.~Das kommt ganz darauf an. — That entirely depends.|Fixed; continue with wie/ob/wann + clause.|A2|Any question you can't answer with yes or no|Answer 5 questions with it plus a condition.
Ich würde lieber ___.|I'd rather ___.|Ich würde lieber zu Hause bleiben. — I'd rather stay home.~Ich würde lieber früher anfangen. — I'd rather start earlier.~Ich hätte lieber Tee. — I'd rather have tea.|Infinitive at the end; with a noun use hätte lieber.|B1|Suggestions, negotiating|Counter 5 proposals politely.
Mir gefällt ___.|I like ___ (the look, sound, style of it).|Mir gefällt diese Stadt. — I like this city.~Mir gefällt das Design. — I like the design.~Mir gefällt es hier. — I like it here.|Nominative noun — the thing pleases you, so it is the subject.|A2|Reacting to things|Compare: Ich mag / Mir gefällt / Ich finde … gut.
Mir gefällt ___ besser als ___.|I like ___ better than ___.|Mir gefällt Berlin besser als München. — I like Berlin better than Munich.~Mir gefällt Kaffee besser als Tee. — I prefer coffee to tea.~Mir gefällt diese Version besser. — I like this version better.|Two nominative nouns.|A2|Choosing, comparing|Compare 6 pairs of things.
Ich bevorzuge ___.|I prefer ___ (neutral, slightly formal).|Ich bevorzuge das kleinere Modell. — I prefer the smaller model.~Ich bevorzuge klare Regeln. — I prefer clear rules.~Ich bevorzuge es, früh anzufangen. — I prefer to start early.|Accusative noun, or es, … zu + infinitive.|B2|Work, written German|Say the same preference casually and formally.
Ich bin dafür.|I'm in favour.|Ich bin dafür, dass wir früher anfangen. — I'm for starting earlier.~Ich bin absolut dafür. — I'm completely for it.~Wer ist dafür? — Who's in favour?|Fixed, or + dass-clause.|B1|Team decisions|Vote on 5 proposals out loud.
Ich bin dagegen.|I'm against it.|Ich bin dagegen, das jetzt zu entscheiden. — I'm against deciding that now.~Ich bin eher dagegen. — I'm rather against it.~Ich habe nichts dagegen. — I have nothing against it.|Fixed, or + zu-infinitive / dass-clause.|B1|Team decisions|Object to 4 plans and give a reason each.
Für mich ist ___ wichtig.|For me, ___ is important.|Für mich ist Pünktlichkeit wichtig. — Punctuality matters to me.~Für mich ist das kein Problem. — For me that's no problem.~Für mich ist es wichtig, ehrlich zu sein. — For me it's important to be honest.|Nominative noun, or es … zu + infinitive.|A2|Interviews, values, dating|Name 5 things that matter to you.
Es wäre besser, wenn ___.|It would be better if ___.|Es wäre besser, wenn wir früher gehen. — It'd be better if we left earlier.~Es wäre besser, wenn du ihn fragst. — It'd be better if you asked him.~Es wäre besser gewesen. — It would have been better.|wenn-clause with the verb at the end.|B1|Advice, feedback|Give 5 pieces of gentle advice.
Es wäre schön, wenn ___.|It would be nice if ___.|Es wäre schön, wenn du mitkommst. — It'd be nice if you came along.~Es wäre schön, wenn das klappt. — It'd be lovely if that works out.~Es wäre schön gewesen. — It would have been nice.|wenn-clause, verb at the end.|B1|Invitations, soft requests|Turn 5 demands into wishes.
Ich hätte gern ___.|I'd like ___ — the standard ordering phrase.|Ich hätte gern ein Bier, bitte. — I'd like a beer, please.~Ich hätte gern zwei Brötchen. — I'd like two rolls.~Ich hätte gern einen Termin. — I'd like an appointment.|Accusative noun.|A1|Bakery, restaurant, counter|Order 8 things without hesitating.
Ich hätte eine Frage.|I have a question (politely).|Ich hätte eine kurze Frage. — I have a quick question.~Ich hätte da eine Frage. — I've got a question there.~Ich hätte noch eine Frage. — I have one more question.|Fixed; add kurz / noch.|A2|Work, courses, offices|Open 5 questions with it.
Darf ich dich etwas fragen?|May I ask you something?|Darf ich dich etwas Persönliches fragen? — May I ask you something personal?~Darf ich Sie kurz etwas fragen? — May I ask you something briefly?~Kann ich dich was fragen? — Can I ask you something? (casual)|Fixed; was is the casual form of etwas.|A2|Friends, colleagues|Open a personal question politely.
Kannst du mir erklären, warum ___?|Can you explain to me why ___?|Kannst du mir erklären, warum das so ist? — Can you explain why it's like that?~Können Sie mir erklären, wie das funktioniert? — Can you explain how this works?~Kannst du mir erklären, was das bedeutet? — Can you explain what that means?|warum / wie / was + clause with the verb at the end.|B1|Work, learning|Ask for 5 explanations.
Was hältst du von ___?|What do you think of ___?|Was hältst du von dem Vorschlag? — What do you think of the suggestion?~Was halten Sie davon? — What's your view on that?~Was hältst du von dieser Idee? — What do you think of this idea?|von + dative noun, or davon.|B1|Discussions, opinions|Ask 5 people's views on 5 topics.
Wie findest du ___?|How do you like ___? The everyday version.|Wie findest du die Stadt? — How do you like the city?~Wie findest du das? — What do you think of that?~Wie finden Sie das Ergebnis? — What do you think of the result?|Accusative noun.|A2|Small talk|Ask about 6 things in the room.
Was hast du gestern gemacht?|What did you do yesterday?|Was hast du am Wochenende gemacht? — What did you do at the weekend?~Was hast du gestern Abend gemacht? — What did you do last night?~Und, was habt ihr gemacht? — So, what did you guys do?|Swap the time expression.|A2|Small talk, every Monday|Answer it yourself in 5 sentences.
Was machst du normalerweise ___?|What do you normally do ___?|Was machst du normalerweise am Wochenende? — What do you usually do at the weekend?~Was machst du normalerweise nach der Arbeit? — What do you normally do after work?~Normalerweise mache ich gar nichts. — Normally I do nothing at all.|A time phrase: am Wochenende, abends, im Sommer.|A2|Small talk|Describe your typical day in 6 sentences.
Was hast du vor?|What are your plans?|Was hast du heute Abend vor? — What are you up to tonight?~Hast du am Samstag schon was vor? — Do you have plans on Saturday?~Ich habe nichts Besonderes vor. — I have nothing special planned.|Add a time phrase. vorhaben is separable: vor goes to the end.|A2|Making plans with friends|Ask and answer for the next 5 days.
Was ist passiert?|What happened?|Was ist denn passiert? — So what happened?~Erzähl, was passiert ist. — Tell me what happened.~Es ist nichts passiert. — Nothing happened.|Fixed; passieren takes sein in the perfect.|A2|Stories, problems|Ask, then narrate a small incident.
Was meinst du?|What do you think? / What do you mean?|Was meinst du dazu? — What do you think about it?~Was meinst du, sollen wir gehen? — What do you reckon, shall we go?~Wie meinst du das? — How do you mean that?|Add dazu, or a full question after the comma.|A2|Involving other people|Hand the conversation back 5 times.
Warum eigentlich?|Why, actually? Curious, friendly.|Warum eigentlich nicht? — Why not, actually?~Wieso eigentlich? — How come?~Warum fragst du eigentlich? — Why do you ask, by the way?|eigentlich softens and adds curiosity.|A2|Casual conversation|Add eigentlich to 5 questions.
Seit wann ___?|Since when / how long ___?|Seit wann wohnst du hier? — How long have you lived here?~Seit wann lernst du Deutsch? — How long have you been learning German?~Seit wann ist das so? — Since when is that the case?|Present tense verb — German uses the present with seit.|A2|Getting to know someone|Ask 5 seit-questions and answer them.
Wie lange ___?|How long ___?|Wie lange dauert das? — How long does that take?~Wie lange bleibst du? — How long are you staying?~Wie lange bist du schon hier? — How long have you been here?|Verb right after wie lange.|A1|Travel, appointments|Ask about the length of 6 things.
Wie oft ___?|How often ___?|Wie oft gehst du ins Fitnessstudio? — How often do you go to the gym?~Wie oft fährt der Bus? — How often does the bus run?~Wie oft machst du das? — How often do you do that?|Verb second.|A1|Habits, transport|Ask and answer 5 frequency questions.
Ich bin gerade ___.|I'm just / currently ___.|Ich bin gerade unterwegs. — I'm on my way right now.~Ich bin gerade beschäftigt. — I'm busy at the moment.~Ich bin gerade erst angekommen. — I've only just arrived.|Adjective, place, or perfect participle.|A2|Phone calls, messages|Describe your state 5 times today.
Ich war gerade ___.|I was just ___.|Ich war gerade beim Arzt. — I was just at the doctor's.~Ich war gerade dabei zu gehen. — I was just about to leave.~Ich war gerade im Supermarkt. — I was just at the supermarket.|bei + dative, in + dative, or dabei zu + infinitive.|A2|Explaining, catching up|Report 5 places you were today.
Ich werde ___.|I will ___ (future, or a firm intention).|Ich werde dich anrufen. — I'll call you.~Ich werde das morgen machen. — I'll do that tomorrow.~Das werde ich nie vergessen. — I'll never forget that.|Infinitive at the end. For near plans Germans often just use the present: Ich mache das morgen.|A2|Promises, plans|Say 5 promises, then convert them to present tense.
Ich habe ___ gemacht.|I did / have done ___. The everyday past tense.|Ich habe das schon gemacht. — I've already done that.~Ich habe gestern viel gearbeitet. — I worked a lot yesterday.~Ich habe nichts gemacht. — I didn't do anything.|Participle at the very end; most verbs use haben.|A2|Talking about yesterday|Narrate your day in 8 perfect-tense sentences.
Ich bin ___ gegangen.|I went ___. Movement verbs take sein.|Ich bin nach Hause gegangen. — I went home.~Ich bin früh aufgestanden. — I got up early.~Ich bin zum Arzt gefahren. — I drove to the doctor.|Movement or change of state: gehen, fahren, kommen, aufstehen, bleiben, sein.|A2|Past stories|Tell 6 movements from yesterday with sein.
Ich habe vor, morgen ___ zu ___.|I plan to ___ tomorrow.|Ich habe vor, morgen früher aufzustehen. — I plan to get up earlier tomorrow.~Ich habe vor, morgen einzukaufen. — I plan to go shopping tomorrow.~Ich hatte vor, dich anzurufen. — I was planning to call you.|zu-infinitive at the end; separable verbs: einzukaufen, aufzustehen.|B1|Planning|Plan tomorrow in 5 sentences.
Wenn ich Zeit habe, ___.|When I have time, ___.|Wenn ich Zeit habe, gehe ich laufen. — When I have time I go running.~Wenn ich Zeit habe, rufe ich zurück. — When I have time I'll call back.~Wenn ich morgen Zeit habe, komme ich vorbei. — If I have time tomorrow I'll drop by.|Main clause with the verb first after the comma.|A2|Plans, excuses|Make 5 conditional promises.
Wenn ich mehr Zeit hätte, würde ich ___.|If I had more time, I would ___.|Wenn ich mehr Zeit hätte, würde ich mehr reisen. — If I had more time I'd travel more.~Wenn ich reich wäre, würde ich ein Haus kaufen. — If I were rich I'd buy a house.~Wenn ich du wäre, würde ich warten. — If I were you I'd wait.|Infinitive at the end after würde.|B1|Hypotheticals, advice|Dream out loud 5 times.
Ich habe das Gefühl, dass ___.|I have the feeling that ___.|Ich habe das Gefühl, dass etwas nicht stimmt. — I feel something's off.~Ich habe das Gefühl, dass es besser wird. — I feel it's getting better.~Ich hatte das Gefühl, dass er lügt. — I had the feeling he was lying.|dass-clause, verb at the end.|B1|Intuition, soft claims|Express 5 hunches.
Es sieht so aus, als ob ___.|It looks as if ___.|Es sieht so aus, als ob es regnet. — It looks like it's raining.~Es sieht so aus, als ob wir zu spät kommen. — Looks like we'll be late.~Es sieht gut aus. — It looks good.|als ob + clause, verb at the end.|B2|Speculating|Speculate about 4 situations.
Soweit ich weiß, ___.|As far as I know, ___.|Soweit ich weiß, ist das Büro geschlossen. — As far as I know the office is closed.~Soweit ich weiß, kommt sie später. — As far as I know she's coming later.~Soweit ich weiß, nicht. — Not as far as I know.|Main clause with the verb right after the comma.|B1|Careful information|Report 5 uncertain facts.
So weit, so gut.|So far, so good.|So weit, so gut — mal sehen. — So far so good, we'll see.~Bis jetzt läuft alles gut. — Everything's going well so far.~So weit, so gut, aber es fehlt noch etwas. — So far so good, but something's missing.|Fixed expression.|B1|Status updates|Report progress on 3 projects.

Personal pronouns|🔥|German changes the pronoun depending on its job in the sentence: subject (nominative), direct object (accusative), indirect object (dative). You use these in literally every sentence, so drill them until they are reflexes.|ich–mich–mir · du–dich–dir · er–ihn–ihm · sie–sie–ihr · wir–uns–uns · ihr–euch–euch · sie/Sie–sie/Sie–ihnen/Ihnen|Ich sehe dich. — I see you.~Kannst du mir helfen? — Can you help me?~Ich gebe ihm das Buch. — I give him the book.~Wir treffen euch später. — We'll meet you later.|WRONG: Kannst du mich helfen? → RIGHT: Kannst du mir helfen? — helfen always takes the dative.|Say one sentence for each of the nine pronouns, in all three cases: 27 short sentences.|Learn ich/du/er/sie + mir/dir first — they cover most conversations.|The distinction between ihr (you plural) and ihr (to her) sorts itself out with exposure.
sein and haben|🔥|These two verbs appear in about a quarter of all German sentences: as main verbs and as the helpers that build the past tense. Memorise all forms out loud, not on paper.|ich bin, du bist, er ist, wir sind, ihr seid, sie sind · ich habe, du hast, er hat, wir haben, ihr habt, sie haben|Ich bin müde. — I'm tired.~Wir sind zu spät. — We're late.~Hast du Zeit? — Do you have time?~Sie hat keine Lust. — She doesn't feel like it.|WRONG: Ich bin 30 Jahre. → RIGHT: Ich bin 30 Jahre alt. And WRONG: Ich bin kalt (= I'm a cold person) → RIGHT: Mir ist kalt.|Describe five people you know using sein and haben — ten sentences, no notes.|Learn all six forms of both, today.|Their past forms (war, hatte) can wait a week.
Present tense|🔥|German has one present tense and it covers English's "I do", "I am doing" and often "I will do". Endings: -e, -st, -t, -en, -t, -en. Some verbs change their stem vowel in du and er/sie/es.|ich mach-e · du mach-st · er mach-t · wir mach-en · ihr mach-t · sie mach-en|Ich arbeite von zu Hause. — I work / am working from home.~Was machst du gerade? — What are you doing right now?~Er fährt morgen nach Berlin. — He's going to Berlin tomorrow.~Wir sehen uns um acht. — We'll see each other at eight.|WRONG: Ich bin arbeiten. → RIGHT: Ich arbeite. There is no "am + -ing" in German.|Conjugate ten verbs out loud in full, then use each in a real sentence about your day.|The six endings, plus the vowel changes in fahren → fährt, sprechen → spricht, essen → isst, sehen → sieht, nehmen → nimmt.|Rare irregular stems can be picked up one at a time.
Modal verbs|🔥|können, müssen, wollen, sollen, dürfen, mögen let you express ability, obligation, wishes and permission. The modal is conjugated in position 2; the other verb goes to the very end as an infinitive. This single pattern unlocks hundreds of sentences.|Subject + modal + … + infinitive (last)|Ich kann heute nicht kommen. — I can't come today.~Du musst das nicht machen. — You don't have to do that.~Wir wollen morgen früh los. — We want to leave early tomorrow.~Darf ich kurz stören? — May I interrupt briefly?|WRONG: Ich kann sprechen Deutsch. → RIGHT: Ich kann Deutsch sprechen. The infinitive goes last.|Take ten simple sentences and add a modal to each — the main verb must land at the end every time.|Learn können, müssen, möchte first: they cover ability, obligation and polite wanting.|mögen as a full verb and sollen's subtler meanings can come later.
Verb-second rule|🔥|In a normal German statement the conjugated verb is always the second element — not necessarily the second word. Whatever you put first (time, place, object), the verb stays in slot two and the subject moves behind it.|[anything] + VERB + subject + rest|Ich gehe heute ins Kino. — I'm going to the cinema today.~Heute gehe ich ins Kino. — Today I'm going to the cinema.~Ins Kino gehe ich heute. — To the cinema I'm going today.~Morgen habe ich keine Zeit. — Tomorrow I have no time.|WRONG: Heute ich gehe ins Kino. → RIGHT: Heute gehe ich ins Kino. The subject slides behind the verb.|Take one sentence and say it four ways, starting with a different element each time. The verb must never move.|This is the single most important rule in the language. Drill it daily for a week.|Fine-tuning which element to front for emphasis comes with feel.
Questions|🔥|Two types. W-questions start with a question word, then the verb. Yes/no questions start with the verb itself. Both are simpler than English — no "do" helper.|Wo wohnst du? · Wohnst du hier?|Wann kommst du? — When are you coming?~Warum nicht? — Why not?~Hast du Zeit? — Do you have time?~Kannst du mir helfen? — Can you help me?|WRONG: Wo du wohnst? → RIGHT: Wo wohnst du? The verb comes straight after the question word.|Ask a partner (or the mirror) twenty questions in two minutes, alternating W-questions and yes/no questions.|The nine question words and the verb-first pattern.|Indirect questions (Weißt du, wo …ist?) come with subordinate clauses.

Ich hätte eine Frage.|I have a question.|Standard at work or in offices.
Weißt du zufällig, ob …?|Do you happen to know whether …?|zufällig = by any chance.
Können Sie mir sagen, wo … ist?|Can you tell me where … is?|Verb at the end of the second clause.
Was genau meinst du?|What exactly do you mean?|Clarifying without sounding rude.
Wie funktioniert das hier?|How does it work here?|Great in offices, gyms, shops.
Ist das richtig so?|Is this right like this?|Checking you've done something correctly.
Hast du kurz Zeit?|Do you have a minute?|kurz makes it easy to say yes.
`)},
{g:"Asking someone to repeat", items:P(`
Wie bitte?|Sorry, what?|The shortest polite version. Use it freely.
Können Sie das bitte wiederholen?|Could you repeat that, please?|Formal.
Kannst du das nochmal sagen?|Can you say that again?|Informal.
Etwas langsamer, bitte.|A bit slower, please.|Short and effective.
Ich habe nur die Hälfte verstanden.|I only understood half.|Tells them how much to repeat.
Können Sie das buchstabieren?|Could you spell that?|Essential for names and streets.
Wie schreibt man das?|How do you spell / write that?|—
Noch mal von vorne, bitte.|From the beginning again, please.|—
`)},
{g:"Misunderstandings", items:P(`
Entschuldigung, ich lerne noch Deutsch.|Sorry, I'm still learning German.|Instantly buys patience.
Ich habe das falsch verstanden.|I misunderstood that.|Takes responsibility calmly.
Ich meinte etwas anderes.|I meant something else.|Repairs your own sentence.
Anders gesagt …|Put differently …|Restart without apologising.
Ich glaube, wir reden aneinander vorbei.|I think we're talking at cross purposes.|Very natural phrase.
Habe ich Sie richtig verstanden, dass …?|Did I understand correctly that …?|Confirms before acting.
Das war ein Missverständnis.|That was a misunderstanding.|Defuses tension.
Tut mir leid, mein Fehler.|Sorry, my mistake.|Short and adult.
`)},
{g:"Shopping", items:P(`
Ich suche …|I'm looking for …|Accusative.
Haben Sie das in einer anderen Größe?|Do you have this in another size?|—
Wo finde ich …?|Where do I find …?|—
Was kostet das?|How much is this?|—
Kann ich mit Karte zahlen?|Can I pay by card?|Still worth asking in Germany.
Ich schaue nur, danke.|I'm just looking, thanks.|Standard reply to Kann ich helfen?
Kann ich das umtauschen?|Can I exchange this?|Bring the Kassenbon (receipt).
Eine Tüte, bitte.|A bag, please.|Usually costs money.
`)},
{g:"Restaurants", items:P(`
Ein Tisch für zwei, bitte.|A table for two, please.|—
Die Karte, bitte.|The menu, please.|—
Ich hätte gern …|I'd like …|The standard ordering phrase.
Was können Sie empfehlen?|What can you recommend?|—
Ich nehme das Gleiche.|I'll have the same.|Saves you when you can't read the menu.
Noch ein Bier, bitte.|Another beer, please.|noch ein = one more.
Zahlen, bitte.|The bill, please.|Or: Ich möchte bitte bezahlen.
Zusammen oder getrennt? — Getrennt, bitte.|Together or separately? — Separately, please.|You'll be asked every time.
`)},
{g:"Public transport", items:P(`
Eine Fahrkarte nach …, bitte.|A ticket to …, please.|—
Fährt dieser Bus zum Bahnhof?|Does this bus go to the station?|—
Wo muss ich umsteigen?|Where do I have to change?|—
Wann fährt der nächste Zug?|When does the next train leave?|—
Ist dieser Platz frei?|Is this seat free?|—
Der Zug hat Verspätung.|The train is delayed.|You'll hear this often.
Entschuldigung, ich muss hier raus.|Sorry, I need to get out here.|raus = casual for hinaus.
Welche Haltestelle ist das?|Which stop is this?|—
`)},
{g:"At work", items:P(`
Ich melde mich später dazu.|I'll get back to you on that later.|Buys time professionally.
Können wir das kurz besprechen?|Can we discuss that briefly?|—
Ich brauche noch etwas Zeit.|I need a bit more time.|Honest and acceptable.
Ich kümmere mich darum.|I'll take care of it.|Strong, reliable phrase.
Könnten Sie das noch einmal erklären?|Could you explain that once more?|Better than pretending to understand.
Ich schicke dir die Unterlagen.|I'll send you the documents.|—
Passt Ihnen Dienstag um zehn?|Does Tuesday at ten suit you?|passen + dative.
Schönen Feierabend!|Have a good evening (after work)!|Very German, very friendly.
`)},
{g:"School and courses", items:P(`
Ich möchte mich für den Kurs anmelden.|I'd like to register for the course.|—
Wann ist die Prüfung?|When is the exam?|—
Können Sie das bitte noch einmal erklären?|Could you explain that again, please?|—
Ich habe eine Frage zur Hausaufgabe.|I have a question about the homework.|zu + dative.
Ich war letzte Woche krank.|I was ill last week.|—
Wo finde ich den Raum?|Where do I find the room?|—
Bis wann muss ich das abgeben?|By when do I have to hand this in?|—
Gibt es Unterlagen dazu?|Are there materials for that?|—
`)},
{g:"Appointments", items:P(`
Ich hätte gern einen Termin.|I'd like an appointment.|Opening line for everything official.
Haben Sie etwas früher frei?|Do you have anything earlier?|—
Passt Ihnen Donnerstag?|Does Thursday suit you?|—
Ich muss den Termin leider absagen.|Unfortunately I have to cancel the appointment.|Cancel, don't ghost.
Können wir den Termin verschieben?|Can we move the appointment?|—
Ich bin um zehn da.|I'll be there at ten.|—
Ich komme leider zehn Minuten später.|I'll be ten minutes late, sorry.|Send this message — punctuality matters.
Was muss ich mitbringen?|What do I need to bring?|Ask this every time in an Amt.
`)},
{g:"Phone calls", items:P(`
Guten Tag, hier spricht …|Hello, this is … speaking.|Germans say their surname when answering.
Könnte ich bitte … sprechen?|Could I speak to …, please?|—
Ich rufe wegen … an.|I'm calling about …|wegen + genitive/dative.
Können Sie mich zurückrufen?|Could you call me back?|—
Die Verbindung ist schlecht.|The connection is bad.|Useful excuse and true often enough.
Ich verstehe Sie sehr schlecht.|I can hear you very poorly.|—
Kann ich eine Nachricht hinterlassen?|Can I leave a message?|—
Vielen Dank, auf Wiederhören.|Thanks, goodbye (on the phone).|Wiederhören, not Wiedersehen.
`)},
{g:"Emergencies", items:P(`
Hilfe!|Help!|—
Rufen Sie einen Krankenwagen!|Call an ambulance!|Emergency number: 112.
Ich brauche einen Arzt.|I need a doctor.|—
Es ist ein Notfall.|It's an emergency.|—
Mir geht es nicht gut.|I don't feel well.|—
Ich habe starke Schmerzen.|I'm in a lot of pain.|—
Können Sie mir helfen?|Can you help me?|—
Ich habe meinen Geldbeutel verloren.|I've lost my wallet.|Police: 110.
`)},
{g:"Directions", items:P(`
Entschuldigung, wie komme ich zu …?|Excuse me, how do I get to …?|zu + dative.
Ist es weit von hier?|Is it far from here?|—
Können Sie mir das auf der Karte zeigen?|Can you show me on the map?|—
Immer geradeaus, dann links.|Straight ahead, then left.|You'll hear this reply.
An der Ampel rechts.|Right at the traffic light.|—
Gleich um die Ecke.|Just around the corner.|—
Ich habe mich verlaufen.|I've got lost (on foot).|—
Welcher Bus fährt dahin?|Which bus goes there?|—
`)},
{g:"Making plans", items:P(`
Hast du am Samstag schon was vor?|Do you have plans on Saturday?|The standard invitation opener.
Sollen wir was zusammen machen?|Shall we do something together?|was = etwas.
Wann passt es dir?|When suits you?|—
Wo treffen wir uns?|Where shall we meet?|—
Ich schreibe dir noch.|I'll message you later.|noch = still, at some point.
Sagen wir um acht?|Shall we say eight?|—
Klingt gut, bin dabei.|Sounds good, I'm in.|bin dabei = count me in.
Lass uns das ausmachen.|Let's arrange that.|einen Termin ausmachen.
`)},
{g:"Cancelling plans", items:P(`
Ich muss leider absagen.|Unfortunately I have to cancel.|Say it early, not last minute.
Mir ist etwas dazwischengekommen.|Something came up.|The standard, accepted reason.
Können wir verschieben?|Can we reschedule?|Always offer this.
Tut mir wirklich leid.|I'm really sorry.|—
Ich schaffe es heute nicht.|I won't make it today.|—
Nächste Woche gerne wieder.|Happy to do it next week.|Keeps the door open.
Ich melde mich, sobald ich mehr weiß.|I'll be in touch as soon as I know more.|Verb at the end after sobald.
Ich bin leider krank geworden.|Unfortunately I've fallen ill.|—
`)},
{g:"Apologising", items:P(`
Entschuldigung!|Sorry! / Excuse me!|All-purpose.
Es tut mir leid.|I'm sorry.|For real apologies.
Das war mein Fehler.|That was my mistake.|Owning it is respected.
Das wollte ich nicht.|I didn't mean to.|—
Ich habe das nicht so gemeint.|I didn't mean it like that.|—
Kann ich das irgendwie wiedergutmachen?|Can I make up for it somehow?|—
Entschuldigen Sie die Verspätung.|Sorry for the delay.|Formal, e.g. at work.
Sorry, ist mir rausgerutscht.|Sorry, that slipped out.|Casual.
`)},
{g:"Thanking", items:P(`
Danke!|Thanks!|—
Vielen Dank!|Many thanks!|Slightly stronger.
Danke dir / Ihnen!|Thank you (informal / formal)!|—
Das ist lieb von dir.|That's kind of you.|Warm and natural.
Danke für deine Hilfe.|Thanks for your help.|für + accusative.
Ich weiß das sehr zu schätzen.|I really appreciate that.|Formal register.
Sehr nett, danke!|Very kind, thanks!|—
Kein Problem / Gern!|No problem / You're welcome!|The usual replies.
`)},
{g:"Disagreeing politely", items:P(`
Da bin ich anderer Meinung.|I'm of a different opinion there.|Clear but polite.
Das sehe ich etwas anders.|I see that a bit differently.|etwas softens it.
Ich verstehe den Punkt, aber …|I see the point, but …|Concede first, then argue.
Stimmt schon, allerdings …|That's true enough, however …|Very natural pattern.
Da bin ich mir nicht so sicher.|I'm not so sure about that.|Softest form of disagreement.
Ich würde das anders machen.|I'd do it differently.|Constructive.
Darf ich kurz widersprechen?|May I briefly disagree?|Formal meetings.
Kann sein, aber meiner Meinung nach …|Could be, but in my opinion …|—
`)},
{g:"Expressing uncertainty", items:P(`
Ich bin mir nicht sicher.|I'm not sure.|—
Keine Ahnung, ehrlich gesagt.|No idea, honestly.|Casual and very common.
Ich glaube schon, aber …|I think so, but …|—
Vielleicht, ich weiß es nicht genau.|Maybe, I don't know exactly.|—
Soweit ich weiß …|As far as I know …|—
Das müsste ich nachschauen.|I'd have to look that up.|Professional and honest.
Ich schätze mal …|I'd guess …|schätzen = to estimate.
Ich kann es dir nicht genau sagen.|I can't tell you exactly.|—
`)},
{g:"Expressing opinions", items:P(`
Ich finde das gut.|I think that's good.|The everyday opinion verb.
Meiner Meinung nach …|In my opinion …|Verb comes next.
Für mich ist das …|For me that's …|—
Ich halte das für sinnvoll.|I consider that sensible.|halten für + accusative.
Das gefällt mir (nicht).|I (don't) like that.|—
Ich bin absolut dafür / dagegen.|I'm completely for / against it.|—
Das lohnt sich (nicht).|That's (not) worth it.|—
Ich würde sagen, ja.|I'd say yes.|Softened opinion.
`)},
{g:"Asking for clarification", items:P(`
Was bedeutet das genau?|What does that mean exactly?|—
Wie meinst du das?|How do you mean that?|—
Kannst du ein Beispiel geben?|Can you give an example?|Best clarification question there is.
Also, wenn ich das richtig verstehe …|So if I understand correctly …|Then repeat it back.
Meinst du damit, dass …?|Do you mean by that, that …?|Verb at the end.
Und was heißt das für mich?|And what does that mean for me?|Practical follow-up.
Können Sie das konkreter sagen?|Could you be more specific?|—
Habe ich das richtig verstanden?|Did I get that right?|—
`)}
];

/* ===== 9. COMMON MISTAKES (50) ===== wrong | right | why | natural example */
const MISTAKES = P(`
Ich bin 25 Jahre.|Ich bin 25 Jahre alt.|German keeps alt in the age phrase, or drops Jahre entirely: Ich bin 25.|Ich bin 25 und komme aus Bangladesch.
Ich bin kalt.|Mir ist kalt.|Ich bin kalt describes your personality, not your temperature.|Mach mal das Fenster zu, mir ist kalt.
Ich bin heiß.|Mir ist heiß.|Same trap — Ich bin heiß means "I'm hot" in the attraction sense.|Puh, mir ist total heiß hier drin.
Ich bin agree.|Ich stimme dir zu. / Da hast du recht.|There is no verb "agreen"; use zustimmen + dative or recht haben.|Da stimme ich dir zu.
Ich habe 20 Jahre alt.|Ich bin 20 Jahre alt.|Age uses sein, not haben.|Sie ist erst 20.
Ich bin fertig mit meiner Arbeit heute.|Ich bin heute mit meiner Arbeit fertig.|Time comes before manner and place in the middle field.|Ich bin heute früher fertig.
Ich gehe zu Hause.|Ich gehe nach Hause.|nach Hause = going home; zu Hause = being at home.|Ich fahre jetzt nach Hause, ich bin gleich zu Hause.
Ich besuche meinen Freund gestern.|Ich habe meinen Freund gestern besucht.|Past events need Perfekt in speech.|Ich habe ihn gestern kurz besucht.
Ich bin gearbeitet.|Ich habe gearbeitet.|Only movement and change-of-state verbs take sein.|Ich habe den ganzen Tag gearbeitet.
Ich habe nach Berlin gefahren.|Ich bin nach Berlin gefahren.|fahren is movement → sein.|Ich bin mit dem Zug gefahren.
Heute ich gehe einkaufen.|Heute gehe ich einkaufen.|Verb-second rule: the subject moves behind the verb.|Heute gehe ich noch schnell einkaufen.
Ich kann sprechen Deutsch.|Ich kann Deutsch sprechen.|With a modal, the infinitive goes to the very end.|Ich kann schon ein bisschen Deutsch sprechen.
Weil ich bin müde.|Weil ich müde bin.|After weil the verb goes last.|Ich gehe früher, weil ich müde bin.
Ich denke dass es ist gut.|Ich denke, dass es gut ist.|dass sends the verb to the end, and takes a comma.|Ich denke, dass das funktioniert.
Ich habe nicht Zeit.|Ich habe keine Zeit.|Negate nouns without a definite article using kein-.|Heute habe ich leider keine Zeit.
Ich habe kein gut Deutsch.|Ich spreche noch nicht so gut Deutsch.|Don't force kein onto adjectives; restructure.|Mein Deutsch ist noch nicht so gut.
Kannst du mich helfen?|Kannst du mir helfen?|helfen takes the dative.|Kannst du mir kurz helfen?
Ich rufe dir an.|Ich rufe dich an.|anrufen takes the accusative — the opposite of helfen.|Ich rufe dich heute Abend an.
Ich frage dir etwas.|Ich frage dich etwas.|fragen takes the accusative.|Darf ich dich etwas fragen?
Ich danke dich.|Ich danke dir.|danken takes the dative.|Ich danke dir für alles.
Es gibt ein Problem mit meinem Rechnung.|Es gibt ein Problem mit meiner Rechnung.|Rechnung is feminine: die Rechnung → mit meiner Rechnung.|Mit meiner Rechnung stimmt etwas nicht.
Ich warte für dich.|Ich warte auf dich.|warten takes auf + accusative.|Ich warte draußen auf dich.
Ich freue mich für das Wochenende.|Ich freue mich auf das Wochenende.|Anticipation uses auf + accusative.|Ich freue mich schon aufs Wochenende.
Ich interessiere mich in Musik.|Ich interessiere mich für Musik.|Fixed preposition: für + accusative.|Ich interessiere mich sehr für Technik.
Ich denke über dich oft.|Ich denke oft an dich.|denken an + accusative, and oft comes before the object phrase.|Ich denke oft an zu Hause.
Ich bin einverstanden mit dir, aber…|Da stimme ich dir zu, aber…|einverstanden sein is correct but stiff in conversation.|Stimmt, aber ich sehe einen Haken.
Ich habe 3 Jahre hier gewohnt und wohne noch.|Ich wohne seit drei Jahren hier.|Ongoing situations use present tense + seit.|Ich wohne seit drei Jahren in Chemnitz.
Ich lerne Deutsch für 6 Monate.|Ich lerne seit sechs Monaten Deutsch.|für + time = a planned future duration, not an ongoing one.|Ich lerne seit einem halben Jahr Deutsch.
Ich will einen Kaffee. (im Café)|Ich hätte gern einen Kaffee.|Grammatically fine, socially blunt when ordering.|Ich hätte gern einen Kaffee, bitte.
Ich möchte eine Frage.|Ich hätte eine Frage.|Fixed collocation with hätte.|Ich hätte da mal eine Frage.
Können Sie repeat?|Können Sie das bitte wiederholen?|Don't insert English verbs; use the German one.|Könnten Sie das noch einmal sagen?
Ich bin gut in Deutsch.|Ich kann schon ganz gut Deutsch.|Natural German avoids the "good in X" structure.|Mein Deutsch wird langsam besser.
Ich habe Fun.|Es macht mir Spaß.|Spaß is used with machen, not haben.|Das Lernen macht mir Spaß.
Ich mache eine Entscheidung.|Ich treffe eine Entscheidung.|Fixed collocation: eine Entscheidung treffen.|Ich muss bald eine Entscheidung treffen.
Ich nehme eine Dusche.|Ich dusche.|German uses a simple verb where English uses take + noun.|Ich dusche immer morgens.
Ich mache ein Foto von mich.|Ich mache ein Foto von mir.|von takes the dative.|Ich mache kurz ein Foto von dir.
Wir sehen uns am nächsten Montag.|Wir sehen uns nächsten Montag.|No preposition with nächsten + weekday.|Bis nächsten Montag!
Ich gehe in die Arbeit.|Ich gehe zur Arbeit.|Fixed: zur Arbeit gehen/fahren.|Ich fahre mit dem Rad zur Arbeit.
Ich bin in Urlaub gegangen.|Ich bin in Urlaub gefahren. / Ich war im Urlaub.|Choose the verb that matches the movement.|Letzten Sommer war ich zwei Wochen im Urlaub.
Ich habe Hunger nicht.|Ich habe keinen Hunger.|kein- again, not nicht.|Danke, ich habe keinen Hunger.
Das ist besser wie das.|Das ist besser als das.|Comparisons use als; wie means "as … as".|Heute ist es kälter als gestern.
So groß wie möglich schnell.|So schnell wie möglich.|Fixed phrase order.|Ich melde mich so schnell wie möglich.

function todayKey(){ return new Date().toISOString().slice(0,10); }
function bump(field, amt){
 const t = todayKey();
 STATS.days[t] = STATS.days[t] || {min:0};
 STATS[field] = (STATS[field]||0) + amt;
 STATS.sessions++;
 store.set("stats", STATS);
 renderStreakPill();
}
function markPracticedToday(min){
 const t = todayKey();
 STATS.days[t] = STATS.days[t] || {min:0};
 STATS.days[t].min += (min||1);
 store.set("stats", STATS);
 renderStreakPill();
}
function streak(){
 let n=0, d=new Date();
 while(true){
   const k = d.toISOString().slice(0,10);
   if(STATS.days[k]){ n++; d.setDate(d.getDate()-1); } else break;
 }
 return n;
}
function renderStreakPill(){ document.getElementById("streakPill").textContent = "🔥 " + streak(); }

function favBtn(key){
 const on = FAVS[key] ? "on" : "";
 return `<button class="fav ${on}" data-favkey="${esc(key)}" title="Save to favorites" onclick="toggleFav(this)">${FAVS[key]?"★":"☆"}</button>`;
}
function toggleFav(btn){
 const k = btn.getAttribute("data-favkey");
 if(FAVS[k]){ delete FAVS[k]; btn.classList.remove("on"); btn.textContent="☆"; }
 else { FAVS[k]=true; btn.classList.add("on"); btn.textContent="★"; }
 store.set("favs", FAVS);
}
function esc(s){ return String(s).replace(/"/g,"&quot;"); }
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function tagCls(lvl){ return "tag " + (lvl||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function stripDe(s){ return String(s).replace(/<[^>]*>/g,""); }

/* ---------- audio: German text-to-speech via the browser's built-in speech synthesis ---------- */
let germanVoice = null;
let slowMode = store.get("slowmode", false);
function pickGermanVoice(){
 if(!('speechSynthesis' in window)) return null;
 const voices = speechSynthesis.getVoices();
 return voices.find(v=>v.lang==="de-DE") || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("de")) || null;
}
function refreshVoice(){ germanVoice = pickGermanVoice(); updateVoiceBanner(); }
if('speechSynthesis' in window){
 refreshVoice();
 speechSynthesis.onvoiceschanged = refreshVoice;
}
function updateVoiceBanner(){
 const b = document.getElementById("voiceBanner");
 if(!b) return;
 if(!('speechSynthesis' in window)){
   b.innerHTML = "Speech isn't available in this browser. Audio buttons won't produce sound here.";
   b.style.display = "block";
 } else if(!germanVoice){
   b.innerHTML = "No German voice found on this device yet. Audio will still play using the closest available voice — for the best pronunciation, install a German (de-DE) voice in your OS settings.";
   b.style.display = "block";
 } else {

function speakDE(text){
 if(!text) return;
 if(!('speechSynthesis' in window)){ updateVoiceBanner(); return; }
 speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(text);
 u.lang = "de-DE";
 if(germanVoice) u.voice = germanVoice;
 u.rate = slowMode ? 0.62 : 0.95;
 u.pitch = 1;
 speechSynthesis.speak(u);
}
function sb(text){
 if(!text) return "";
 return `<button class="spk" data-text="${escAttr(stripDe(text))}" title="Listen (German)" aria-label="Listen">🔊</button>`;
}
function wrapDe(text, cls){
 // German text with an inline speaker button, for use where a plain .de span was used before
 return `<span class="dewrap">${sb(text)}<span class="${cls||'de'}">${text}</span></span>`;
}
document.addEventListener("click", e=>{
 const b = e.target.closest(".spk");
 if(b){ speakDE(b.getAttribute("data-text")); }
});
function toggleSlow(btn){
 slowMode = !slowMode;
 store.set("slowmode", slowMode);
 btn.classList.toggle("on", slowMode);
}

const GEN_FILLERS = ["das hier","mehr Zeit","einen Kaffee","dir etwas fragen","früher anfangen","es noch mal versuchen","kurz nachdenken","ehrlich sein","dir helfen","pünktlich sein"];
function genVariations(de, btn){
 const out = btn.nextElementSibling;
 let html = "<ol>";
 for(let i=0;i<10;i++){
   const s = de.replace("___", GEN_FILLERS[i%GEN_FILLERS.length]);
   html += `<li>${sb(s)}<span class="de">${s}</span></li>`;
 }
 html += "</ol>";

 bump("formulas", 10);

function runFormulaGenerator(){
 const catI = +document.getElementById("genCat").value;
 const lvl = document.getElementById("genLvl").value;
 const cat = VOCAB[catI];
 let pool = FORMULAS;
 if(lvl!=="All") pool = FORMULAS.filter(f=>f[4]===lvl);
 if(!pool.length) pool = FORMULAS;
 const f = pool[Math.floor(Math.random()*pool.length)];
 const word = cat.items[Math.floor(Math.random()*cat.items.length)][0];
 const task = f[0].replace("___", word.replace(/^(der|die|das)\s/,"").toLowerCase());
 const out = document.getElementById("genTaskOut");
 let variations = "<ol>";
 cat.items.slice(0,5).forEach(it=>{
   const w = it[0].replace(/^(der|die|das)\s/,"").toLowerCase();
   const s = f[0].replace("___", w);
   variations += `<li>${sb(s)}<span class="de">${s}</span></li>`;
 });
 variations += "</ol>";
 out.innerHTML = `<div class="note"><b>Topic:</b> ${cat.cat} · <span class="tag ${tagCls(f[4])}">${f[4]}</span></div>
  <div class="drill">${sb(task)}<span class="de big">${task}</span></div>

 bump("formulas", 5);
}

  ${due.slice(0,20).map(it=>`<div class="card" data-srskey="${esc(it.key)}">${sb(it.de)}<span class="de big">${it.de}</span> — <span class="en">${it.en}</span>
   <div class="row"><button class="btn sm ghost" onclick="srsAnswer('${esc(it.key)}',false)">Hard — show again soon</button><button class="btn sm" onclick="srsAnswer('${esc(it.key)}',true)">Easy — push back</button></div></div>`).join("")}
 </div>
 <p class="en" style="font-size:13px">${items.length} words in your queue · ${due.length} due now.</p>
`;

const SRS_STAGES = [0,1,3,7,14,30]; // days
function seedSRS(){
 const pool = VOCAB.flatMap((c,ci)=>c.items.map((it,ii)=>({key:"vocab_"+ci+"_"+ii, de:it[0], en:it[1]})));
 let added = 0, tries = 0;
 while(added<10 && tries<200){
   const p = pool[Math.floor(Math.random()*pool.length)];
   tries++;
   if(!SRSCARDS[p.key]){
     SRSCARDS[p.key] = {stage:0, due:Date.now(), de:p.de, en:p.en};
     added++;
   }
 }
 store.set("srscards", SRSCARDS);
 render("srs");
}
function srsAnswer(key, easy){
 const c = SRSCARDS[key];
 if(!c) return;
 c.stage = easy ? Math.min(c.stage+1, SRS_STAGES.length-1) : Math.max(c.stage-1, 0);
 const days = SRS_STAGES[c.stage] || 0;
 c.due = Date.now() + Math.max(days,0.2)*86400000;
 store.set("srscards", SRSCARDS);
 bump("vocab", 1);
 render("srs");
}

R.flashcards = () => `
 <h1>Flashcards</h1>
 <div class="row"><label>Deck: <select id="deckSel" onchange="loadDeck()"><option value="vocab">Vocabulary</option><option value="verbs">Verbs</option><option value="formulas">Formulas</option></select></label>
 <label>Difficulty: <select id="deckLvl" onchange="loadDeck()"><option value="all">All</option><option value="new">Not yet known</option><option value="known">Already known</option></select></label>
 <button class="btn ghost sm" onclick="loadDeck()">Shuffle</button></div>
 <div class="card flash" id="flashCard" onclick="flipCard()"><div class="en">Loading…</div></div>
 <div class="row"><button class="btn ghost" onclick="cardResult(false)">Don't know</button><button class="btn" onclick="cardResult(true)">Know it</button></div>
 <p class="en" style="font-size:13px" id="deckProgress"></p>
`;
let deck = [], deckI = 0, flipped = false;
function deckKeyOf(t,i){ return "card_"+t+"_"+i; }
function loadDeck(){
 const t = document.getElementById("deckSel").value;
 const lvlFilter = document.getElementById("deckLvl") ? document.getElementById("deckLvl").value : "all";
 let full = [];
 if(t==="vocab") full = VOCAB.flatMap(c=>c.items.map(it=>({de:it[0],en:it[1],ex:it[3]})));
 if(t==="verbs") full = VERBS.map(v=>({de:v[0],en:v[1],ex:v[7]}));
 if(t==="formulas") full = FORMULAS.map(f=>({de:f[0],en:f[1],ex:E(f[2])[0]||""}));
 full = full.map((c,i)=>({...c, key:deckKeyOf(t,i)}));
 deck = full.filter(c=>{
   const known = CARDMEM[c.key] && CARDMEM[c.key].known;
   if(lvlFilter==="new") return !known;
   if(lvlFilter==="known") return known;
   return true;
 });
 if(!deck.length) deck = full;
 deck.sort(()=>Math.random()-0.5);
 deckI = 0; flipped = false; showCard();
}
function showCard(){
 if(!deck.length) return;
 const c = deck[deckI % deck.length];
 const mem = CARDMEM[c.key];
 const badge = mem ? (mem.known ? '<span class="tag" style="color:var(--ok)">known</span>' : '<span class="tag" style="color:var(--warn)">still learning</span>') : '<span class="tag">new</span>';
 const el = document.getElementById("flashCard");
 el.innerHTML = flipped
   ? `<div class="en">${c.en}</div><div class="note" style="max-width:none">${sb(c.ex)}<span class="de">${c.ex}</span></div><div class="en" style="font-size:12px">tap to flip back</div>`
   : `${badge}<div class="dewrap">${sb(c.de)}<span class="de big">${c.de}</span></div><div class="en" style="font-size:12px">tap to reveal</div>`;
 const p = document.getElementById("deckProgress");
 if(p) p.textContent = `Card ${(deckI%deck.length)+1} of ${deck.length}`;
}
function flipCard(){ flipped = !flipped; showCard(); }
function cardResult(knew){
 const c = deck[deckI % deck.length];
 CARDMEM[c.key] = {known: knew, seen: ((CARDMEM[c.key]&&CARDMEM[c.key].seen)||0)+1};
 store.set("cardmem", CARDMEM);
 bump("vocab", 1);
 deckI++; flipped = false; showCard();
}

   if(s.g && s.g !== lastG){ html += `<div class="navgrp">${s.g}${GROUP_BLURB[s.g]?`<span class="navgrpsub">${GROUP_BLURB[s.g]}</span>`:""}</div>`; lastG = s.g; }
   html += `<a href="#${s.id}" class="nav" data-id="${s.id}">${s.icon} ${s.label}</a>`;
 });
 nav.innerHTML = html;
 nav.addEventListener("click", e=>{
   const a = e.target.closest("a.nav");
   if(a){ document.getElementById("rail").classList.remove("open"); }
 });
}
function go(id){ location.hash = "#" + id; }
function render(id){
 if(!R[id]) id = "home";
 const wrap = document.getElementById("wrap");
 const banner = `<div class="voicewarn" id="voiceBanner" style="display:none"></div>`;
 wrap.innerHTML = `<section class="view on">${banner}${R[id]()}</section>`;
 document.querySelectorAll(".rail a.nav").forEach(a=>a.classList.toggle("on", a.getAttribute("data-id")===id));
 wrap.scrollTop = 0; window.scrollTo(0,0);
 if(id==="flashcards") loadDeck();
 updateVoiceBanner();
}

function toggleCheck(i){

 CHECK[k] = !CHECK[k];
